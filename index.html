<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bang Jhon | Links</title>
    <meta name="description" content="Muhammad Akbar Al-Hariri — Developer, Creator & Tech Enthusiast. Find all my links here.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Canvas for Aurora/Nebula background -->
    <canvas id="aurora-canvas"></canvas>

    <!-- Noise texture overlay -->
    <div class="noise-overlay"></div>

    <!-- Floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>

    <!-- Particle burst container -->
    <div id="particle-burst"></div>

    <!-- Main wrapper -->
    <div class="wrapper">
        <!-- Cursor glow effect -->
        <div class="cursor-glow" id="cursor-glow"></div>

        <!-- Card -->
        <div class="card" id="main-card">

            <!-- Holographic top stripe -->
            <div class="holo-stripe"></div>

            <!-- Profile Section -->
            <div class="profile-section">
                <!-- Avatar with rings -->
                <div class="avatar-wrapper" id="avatar-wrapper">
                    <div class="avatar-ring ring-1"></div>
                    <div class="avatar-ring ring-2"></div>
                    <div class="avatar-ring ring-3"></div>
                    <div class="avatar-frame">
                        <img src="assets/profile.jpg" alt="Bang Jhon" id="profile-img">
                        <div class="avatar-shine"></div>
                    </div>
                    <!-- Status badge -->
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span class="status-text">Active</span>
                    </div>
                </div>

                <!-- Name & bio -->
                <div class="bio-section">
                    <h1 class="name-text" id="name-text">
                        <span class="name-char" id="name-display"></span>
                        <span class="cursor-blink">|</span>
                    </h1>
                    <div class="role-badge">
                        <span class="role-icon">⚡</span>
                        <span class="role-text" id="role-text"></span>
                    </div>
                    <p class="bio-desc">Crafting digital experiences with passion & precision.</p>

                    <!-- Stats row -->
                    <div class="stats-row">
                        <div class="stat-item">
                            <span class="stat-num" data-target="3">0</span>
                            <span class="stat-label">Projects</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-num" data-target="2">0</span>
                            <span class="stat-label">Years Exp</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-num" data-target="5">0</span>
                            <span class="stat-label">Platforms</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Divider with glow -->
            <div class="glow-divider">
                <div class="glow-line"></div>
                <div class="glow-dot"></div>
                <div class="glow-line"></div>
            </div>

            <!-- Links Section -->
            <div class="links-section">
                <!-- Section label -->
                <p class="links-label">
                    <i class="bi bi-lightning-charge-fill"></i>
                    <span>Find Me On</span>
                    <i class="bi bi-lightning-charge-fill"></i>
                </p>

                <!-- Link Cards -->
                <div class="link-card" id="link-ig" data-index="0">
                    <div class="link-glow-bg ig-glow"></div>
                    <div class="link-inner">
                        <div class="link-icon-box ig-icon">
                            <i class="bi bi-instagram"></i>
                            <div class="icon-ripple"></div>
                        </div>
                        <div class="link-info">
                            <span class="link-title">Instagram</span>
                            <span class="link-sub">@akbr_muhammd</span>
                        </div>
                        <div class="link-arrow">
                            <i class="bi bi-arrow-up-right-circle-fill"></i>
                        </div>
                    </div>
                    <a href="https://instagram.com/akbr_muhammd" target="_blank" class="link-overlay" onclick="launchParticles(event, '#e4405f')"></a>
                </div>

                <div class="link-card" id="link-li" data-index="1">
                    <div class="link-glow-bg li-glow"></div>
                    <div class="link-inner">
                        <div class="link-icon-box li-icon">
                            <i class="bi bi-linkedin"></i>
                            <div class="icon-ripple"></div>
                        </div>
                        <div class="link-info">
                            <span class="link-title">LinkedIn</span>
                            <span class="link-sub">Muhammad Akbar</span>
                        </div>
                        <div class="link-arrow">
                            <i class="bi bi-arrow-up-right-circle-fill"></i>
                        </div>
                    </div>
                    <a href="https://linkedin.com/in/muhammad-akbar-alhariri-693070323/" target="_blank" class="link-overlay" onclick="launchParticles(event, '#0077b5')"></a>
                </div>

                <div class="link-card" id="link-gh" data-index="2">
                    <div class="link-glow-bg gh-glow"></div>
                    <div class="link-inner">
                        <div class="link-icon-box gh-icon">
                            <i class="bi bi-github"></i>
                            <div class="icon-ripple"></div>
                        </div>
                        <div class="link-info">
                            <span class="link-title">GitHub</span>
                            <span class="link-sub">@Akbar330</span>
                        </div>
                        <div class="link-arrow">
                            <i class="bi bi-arrow-up-right-circle-fill"></i>
                        </div>
                    </div>
                    <a href="https://github.com/Akbar330" target="_blank" class="link-overlay" onclick="launchParticles(event, '#ffffff')"></a>
                </div>

                <div class="link-card" id="link-port" data-index="3">
                    <div class="link-glow-bg port-glow"></div>
                    <div class="link-inner">
                        <div class="link-icon-box port-icon">
                            <i class="bi bi-grid-3x3-gap-fill"></i>
                            <div class="icon-ripple"></div>
                        </div>
                        <div class="link-info">
                            <span class="link-title">Bangsatech Dev</span>
                            <span class="link-sub">My startup company</span>
                        </div>
                        <div class="link-arrow">
                            <i class="bi bi-arrow-up-right-circle-fill"></i>
                        </div>
                    </div>
                    <a href="https://bangsatech-dev.vercel.app/" target="_blank" class="link-overlay" onclick="launchParticles(event, '#a855f7')"></a>
                </div>

                <div class="link-card" id="link-tt" data-index="4">
                    <div class="link-glow-bg tt-glow"></div>
                    <div class="link-inner">
                        <div class="link-icon-box tt-icon">
                            <i class="bi bi-tiktok"></i>
                            <div class="icon-ripple"></div>
                        </div>
                        <div class="link-info">
                            <span class="link-title">TikTok</span>
                            <span class="link-sub">@pecintagetea</span>
                        </div>
                        <div class="link-arrow">
                            <i class="bi bi-arrow-up-right-circle-fill"></i>
                        </div>
                    </div>
                    <a href="https://tiktok.com/@pecintagetea" target="_blank" class="link-overlay" onclick="launchParticles(event, '#fe2c55')"></a>
                </div>
            </div>

            <!-- Glow divider 2 -->
            <div class="glow-divider">
                <div class="glow-line"></div>
                <div class="glow-dot"></div>
                <div class="glow-line"></div>
            </div>

            <!-- Footer -->
            <div class="footer-section">
                <div class="footer-badge">
                    <span class="footer-dot"></span>
                    <span>Made with</span>
                    <span class="heart-beat">❤️</span>
                    <span>by Bang Jhon</span>
                    <span class="footer-dot"></span>
                </div>
                <p class="footer-year">© 2025 Muhammad Akbar Al-Hariri</p>
            </div>

        </div>
        <!-- /card -->
    </div>

    <script src="assets/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Linktree</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Font Awesome (optional) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Bootstrap Social (optional for styled buttons) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-social/5.1.1/bootstrap-social.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation"></div>
    
    <!-- Floating Particles -->
    <div class="particles"></div>

    <div class="container">
        <!-- Glass morphism overlay -->
        <div class="glass-overlay"></div>
        
        <!-- Profile -->
        <div class="profile">
            <div class="profile-img-container">
                <img src="assets/profile.jpg" alt="Profile Picture" style="width: 150px; height: 150px; border-radius: 50%;">
            </div>
            <p>Bang Jhon</p>
        </div>

        <!-- Link Buttons -->
        <div class="link">
            <a href="https://instagram.com/akbr_muhammd" onclick="createRipple(event)"><i class="bi bi-instagram"> Instagram </i></a>
            <a href="https://linkedin.com/in/muhammad-akbar-alhariri-693070323/" onclick="createRipple(event)"><i class="bi bi-linkedin"> LinkedIn </i></a>
            <a href="https://github.com/Akbar330" onclick="createRipple(event)"><i class="bi bi-github"> GitHub </i></a>
            <a href="https://akbar330.github.io/portofolio/" onclick="createRipple(event)"><i class="bi bi-github"> Portofolio </i></a>
            <a href="https://tiktok.com/@pecintagetea" onclick="createRipple(event)"><i class="bi bi-tiktok"> TikTok </i></a>
        </div>

        <!-- Footer -->
        <div class="footer">
            ✨ Made with love ✨
        </div>
    </div>

    <script src="assets/script.js">
    </script>
</body>
</html>
